// Colores e Insignias para cada Categoría de Token
const CATEGORIA_BADGES = {
  "Palabra reservada": "bg-purple-900/40 text-purple-300 border-purple-700/50",
  "Identificador": "bg-blue-900/40 text-blue-300 border-blue-700/50",
  "Número entero": "bg-cyan-900/40 text-cyan-300 border-cyan-700/50",
  "Número decimal": "bg-emerald-900/40 text-emerald-300 border-emerald-700/50",
  "Cadena de texto": "bg-amber-900/40 text-amber-300 border-amber-700/50",
  "Operador aritmético": "bg-orange-900/40 text-orange-300 border-orange-700/50",
  "Operador de comparación": "bg-pink-900/40 text-pink-300 border-pink-700/50",
  "Operador de asignación": "bg-indigo-900/40 text-indigo-300 border-indigo-700/50",
  "Operador lógico": "bg-teal-900/40 text-teal-300 border-teal-700/50",
  "Operador bitwise": "bg-violet-900/40 text-violet-300 border-violet-700/50",
  "Operador flecha": "bg-fuchsia-900/40 text-fuchsia-300 border-fuchsia-700/50",
  "Delimitador": "bg-slate-800 text-slate-300 border-slate-700",
  "Comentario": "bg-zinc-800/60 text-zinc-400 border-zinc-700/40"
};

function App() {
  // Estado principal
  const [codigo, setCodigo] = useState(PRESETS[0].codigo);
  const [lenguaje, setLenguaje] = useState("python");
  const [resultado, setResultado] = useState(() => analizarLexico(PRESETS[0].codigo, "python"));
  const [diagnosticoSintactico, setDiagnosticoSintactico] = useState(() =>
    evaluarSintaxisVsLexico(resultado.tokens, resultado.errores, "python")
  );

  // Navegación
  const [seccionActiva, setSeccionActiva] = useState("editor"); // 'editor' | 'historial' | 'ejemplos' | 'comparador' | 'documentacion' | 'configuracion'
  const [pestañaActiva, setPestañaActiva] = useState("tokens"); // 'tokens' | 'errores' | 'detalles' | 'comparacion'
  
  // Filtros de tabla
  const [filtroCategoria, setFiltroCategoria] = useState("todos");
  const [busquedaToken, setBusquedaToken] = useState("");
  const [lineaResaltada, setLineaResaltada] = useState(null);

  // Historial en LocalStorage
  const [historial, setHistorial] = useState(() => {
    try {
      const guardado = localStorage.getItem("jc_analyzer_history");
      return guardado ? JSON.parse(guardado) : [];
    } catch {
      return [];
    }
  });

  // Notificaciones Toast
  const [toast, setToast] = useState(null);

  const mostrarToast = (mensaje, tipo = "info") => {
    setToast({ mensaje, tipo });
    setTimeout(() => setToast(null), 3500);
  };

  // Ejecución del Análisis Léxico
  const ejecutarAnalisis = (codigoAAnalizar = codigo, lang = lenguaje) => {
    const res = analizarLexico(codigoAAnalizar, lang);
    const diag = evaluarSintaxisVsLexico(res.tokens, res.errores, lang);
    setResultado(res);
    setDiagnosticoSintactico(diag);

    // Guardar en historial
    const nuevoRegistro = {
      id: Date.now(),
      fecha: new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
      fechaCompleta: new Date().toLocaleDateString("es-MX"),
      lenguaje: lang,
      codigoSnippet: codigoAAnalizar.slice(0, 80) + (codigoAAnalizar.length > 80 ? "..." : ""),
      codigoCompleto: codigoAAnalizar,
      totalTokens: res.totalTokens,
      totalErrores: res.totalErrores,
      duracionMs: res.duracionMs,
      estado: res.estadoGeneral
    };

    setHistorial(prev => {
      const actualizado = [nuevoRegistro, ...prev.slice(0, 24)];
      try {
        localStorage.setItem("jc_analyzer_history", JSON.stringify(actualizado));
      } catch (e) {}
      return actualizado;
    });

    mostrarToast(`Análisis completado en ${res.duracionMs} ms`, res.totalErrores === 0 ? "success" : "error");
  };

  // Cambio de lenguaje
  const handleCambioLenguaje = (nuevoLang) => {
    setLenguaje(nuevoLang);
    ejecutarAnalisis(codigo, nuevoLang);
  };

  // Carga de preset
  const handleCargarPreset = (preset) => {
    setCodigo(preset.codigo);
    setLenguaje(preset.lenguaje);
    setSeccionActiva("editor");
    ejecutarAnalisis(preset.codigo, preset.lenguaje);
    mostrarToast(`Cargado: ${preset.titulo}`, "info");
  };

  // Limpiar editor
  const handleLimpiar = () => {
    setCodigo("");
    setResultado({
      lenguaje: CONFIG_LENGUAJES[lenguaje].nombre,
      codigoOriginal: "",
      tokens: [],
      errores: [],
      totalTokens: 0,
      tokensValidos: 0,
      totalErrores: 0,
      conteoCategorias: {},
      duracionMs: 0,
      estadoGeneral: "Limpio",
      reglasAplicadas: 12
    });
    setDiagnosticoSintactico({ tieneAdvertencias: false, advertencias: [] });
    setLineaResaltada(null);
    mostrarToast("Área de código y resultados restablecidos", "info");
  };

  // Copiar código al portapapeles
  const handleCopiarCodigo = () => {
    navigator.clipboard.writeText(codigo);
    mostrarToast("Código copiado al portapapeles", "success");
  };

  // Generar Reporte PDF
  const handleGenerarPDF = () => {
    try {
      generarReportePDF(resultado, diagnosticoSintactico.advertencias);
      mostrarToast("Reporte PDF generado exitosamente", "success");
    } catch (e) {
      mostrarToast("Error al exportar PDF: " + e.message, "error");
    }
  };

  // Atajo de teclado global: Ctrl + Enter para analizar
  useEffect(() => {
    const handleKeyDown = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        ejecutarAnalisis();
      }
    };
    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  }, [codigo, lenguaje]);

  // Lista de tokens filtrada
  const tokensFiltrados = useMemo(() => {
    return resultado.tokens.filter(t => {
      const coincideCat = filtroCategoria === "todos" || t.categoria === filtroCategoria;
      const coincideTexto = !busquedaToken || 
        t.lexema.toLowerCase().includes(busquedaToken.toLowerCase()) || 
        t.categoria.toLowerCase().includes(busquedaToken.toLowerCase());
      return coincideCat && coincideTexto;
    });
  }, [resultado.tokens, filtroCategoria, busquedaToken]);

  // Líneas del código para numeración y resaltado
  const lineasArray = useMemo(() => codigo.split("\n"), [codigo]);

  return (
    <div className="flex h-screen bg-dark-950 text-slate-100 overflow-hidden font-sans">
      
      {/* ==================================================================== */}
      {/* 1. BARRA LATERAL IZQUIERDA (SIDEBAR)                                 */}
      {/* ==================================================================== */}
      <aside className="w-64 bg-dark-900 border-r border-dark-800 flex flex-col justify-between select-none z-20 flex-shrink-0">
        <div>
          {/* Logo y Encabezado de Marca */}
          <div className="p-4 border-b border-dark-800/80 flex items-center space-x-3">
            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-cyan-400 flex items-center justify-center font-mono font-black text-white text-lg shadow-lg shadow-brand-500/30">
              JC
            </div>
            <div>
              <div className="flex items-center space-x-1.5">
                <span className="font-bold tracking-tight text-white text-sm">JC ANALYZER</span>
                <span className="px-1.5 py-0.5 rounded text-[10px] font-mono font-bold bg-brand-500/20 text-brand-300 border border-brand-500/30">PRO</span>
              </div>
              <p className="text-[11px] text-slate-400 font-medium">Lexical Error Detector</p>
            </div>
          </div>

          {/* Menú de Navegación Principal */}
          <nav className="p-3 space-y-1">
            <button
              onClick={() => setSeccionActiva("editor")}
              className={`w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-semibold transition-all ${
                seccionActiva === "editor"
                  ? "bg-brand-600 text-white shadow-md shadow-brand-600/30 font-bold"
                  : "text-slate-400 hover:text-slate-100 hover:bg-dark-800"
              }`}
            >
              <Icon name="terminal" className="w-4 h-4" />
              <span>Workspace / Editor</span>
            </button>

            <button
              onClick={() => {
                handleLimpiar();
                setSeccionActiva("editor");
              }}
              className="w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-100 hover:bg-dark-800 transition-all"
            >
              <Icon name="code" className="w-4 h-4 text-cyan-400" />
              <span>Nuevo Análisis</span>
            </button>

            <button
              onClick={() => setSeccionActiva("ejemplos")}
              className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold transition-all ${
                seccionActiva === "ejemplos"
                  ? "bg-brand-600 text-white shadow-md shadow-brand-600/30 font-bold"
                  : "text-slate-400 hover:text-slate-100 hover:bg-dark-800"
              }`}
            >
              <div className="flex items-center space-x-3">
                <Icon name="sparkles" className="w-4 h-4 text-amber-400" />
                <span>Ejemplos de Rúbrica</span>
              </div>
              <span className="px-1.5 py-0.2 rounded-full text-[10px] font-mono bg-dark-750 text-slate-300">
                {PRESETS.length}
              </span>
            </button>

            <button
              onClick={() => setSeccionActiva("comparador")}
              className={`w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-semibold transition-all ${
                seccionActiva === "comparador"
                  ? "bg-brand-600 text-white shadow-md shadow-brand-600/30 font-bold"
                  : "text-slate-400 hover:text-slate-100 hover:bg-dark-800"
              }`}
            >
              <Icon name="compare" className="w-4 h-4 text-purple-400" />
              <span>Comparar 3 Lenguajes</span>
            </button>

            <button
              onClick={() => setSeccionActiva("historial")}
              className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold transition-all ${
                seccionActiva === "historial"
                  ? "bg-brand-600 text-white shadow-md shadow-brand-600/30 font-bold"
                  : "text-slate-400 hover:text-slate-100 hover:bg-dark-800"
              }`}
            >
              <div className="flex items-center space-x-3">
                <Icon name="history" className="w-4 h-4 text-emerald-400" />
                <span>Historial de Análisis</span>
              </div>
              {historial.length > 0 && (
                <span className="px-1.5 py-0.2 rounded-full text-[10px] font-mono bg-dark-750 text-slate-300">
                  {historial.length}
                </span>
              )}
            </button>

            <button
              onClick={() => setSeccionActiva("documentacion")}
              className={`w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-semibold transition-all ${
                seccionActiva === "documentacion"
                  ? "bg-brand-600 text-white shadow-md shadow-brand-600/30 font-bold"
                  : "text-slate-400 hover:text-slate-100 hover:bg-dark-800"
              }`}
            >
              <Icon name="bookOpen" className="w-4 h-4 text-blue-400" />
              <span>Documentación & Teoría</span>
            </button>

            <button
              onClick={() => setSeccionActiva("configuracion")}
              className={`w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-semibold transition-all ${
                seccionActiva === "configuracion"
                  ? "bg-brand-600 text-white shadow-md shadow-brand-600/30 font-bold"
                  : "text-slate-400 hover:text-slate-100 hover:bg-dark-800"
              }`}
            >
              <Icon name="settings" className="w-4 h-4 text-slate-400" />
              <span>Configuración</span>
            </button>
          </nav>
        </div>

        {/* Footer de la Barra Lateral con Metadata Académica */}
        <div className="p-3 border-t border-dark-800/80 bg-dark-900/60 text-[11px] space-y-2">
          <div className="flex items-center justify-between text-slate-400">
            <span className="font-semibold text-slate-300">Autómatas I</span>
            <span className="px-1.5 py-0.5 rounded text-[10px] font-mono bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center space-x-1">

                        </div>
                      ) : (
                        resultado.errores.map((err) => (
                          <div
                            key={err.numero}
                            className="p-4 rounded-xl bg-dark-950 border border-rose-900/40 hover:border-rose-500/60 transition-all flex flex-col md:flex-row md:items-center justify-between gap-3 shadow-md"
                          >
                            <div className="flex items-start space-x-3">
                              <span className="px-2 py-1 rounded bg-rose-500/20 text-rose-400 font-mono font-bold text-xs border border-rose-500/30">
                                Error #{err.numero}
                              </span>
                              <div>
                                <div className="flex items-center space-x-2">
                                  <span className="text-xs font-bold text-white">{err.tipo}</span>
                                  <span className="text-slate-400 text-xs">•</span>
                                  <span className="text-xs text-amber-400 font-mono">
                                    Línea {err.linea}, Columna {err.columna}
                                  </span>
                                </div>
                                <p className="text-xs text-slate-300 mt-1">{err.descripcion}</p>
                                <p className="text-[11px] text-slate-400 mt-1.5 italic bg-dark-900 p-2 rounded border border-dark-800">
                                  <strong>Fundamento Teórico:</strong> {err.explicacion}
                                </p>
                              </div>
                            </div>

                            <div className="flex-shrink-0">
                              <span className="px-3 py-1.5 rounded-lg bg-rose-950 text-rose-300 border border-rose-700/60 font-mono font-bold text-xs inline-block">
                                '{err.lexema}'
                              </span>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  )}

                  {/* PESTAÑA 3: DETALLES TÉCNICOS */}
                  {pestañaActiva === "detalles" && (
                    <div className="space-y-4 text-xs">
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="p-3 rounded-lg bg-dark-950 border border-dark-800">
                          <span className="text-slate-400 block mb-1 font-semibold">Lenguaje de Gramática</span>
                          <span className="text-sm font-bold text-white">{resultado.lenguaje}</span>
                        </div>
                        <div className="p-3 rounded-lg bg-dark-950 border border-dark-800">
                          <span className="text-slate-400 block mb-1 font-semibold">Tiempo de Escaneo (Real)</span>
                          <span className="text-sm font-bold text-purple-400 font-mono">{resultado.duracionMs} ms</span>
                        </div>
                        <div className="p-3 rounded-lg bg-dark-950 border border-dark-800">
                          <span className="text-slate-400 block mb-1 font-semibold">Reglas Léxicas Compiladas</span>
                          <span className="text-sm font-bold text-cyan-400 font-mono">{resultado.reglasAplicadas} Autómatas</span>
                        </div>
                      </div>

                      {/* Desglose de Categorías */}
                      <div className="p-4 rounded-lg bg-dark-950 border border-dark-800">
                        <h4 className="font-bold text-slate-200 mb-3 text-xs uppercase tracking-wider">
                          Distribución de Tokens por Categoría
                        </h4>
                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2">
                          {Object.keys(resultado.conteoCategorias).map(cat => (
                            <div key={cat} className="flex items-center justify-between p-2 rounded bg-dark-900 border border-dark-800/80">
                              <span className="text-slate-300 font-medium">{cat}</span>
                              <span className="font-mono font-bold text-brand-400 bg-brand-500/10 px-1.5 py-0.5 rounded text-[11px]">
                                {resultado.conteoCategorias[cat]}
                              </span>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* PESTAÑA 4: COMPARACIÓN RÁPIDA DE LENGUAJES */}
                  {pestañaActiva === "comparacion" && (
                    <div className="space-y-4">
                      <div className="p-3 bg-dark-950 rounded-lg border border-dark-800 text-xs text-slate-400">
                        Inspecciona en tiempo real cómo el código actual se comportaría en los tres compiladores:
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                        {["python", "java", "javascript"].map((lang) => {
                          const res = analizarLexico(codigo, lang);
                          return (
                            <div key={lang} className="p-3.5 rounded-xl bg-dark-950 border border-dark-800 flex flex-col justify-between shadow-lg">
                              <div>
                                <div className="flex items-center justify-between mb-2 pb-2 border-b border-dark-800">
                                  <span className="font-bold text-white text-xs capitalize flex items-center space-x-1">
                                    <span>{lang === "python" ? "🐍" : lang === "java" ? "☕" : "⚡"}</span>
                                    <span>{CONFIG_LENGUAJES[lang].nombre}</span>
                                  </span>
                                  <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                    res.totalErrores === 0 ? "bg-emerald-500/20 text-emerald-400" : "bg-rose-500/20 text-rose-400"
                                  }`}>
                                    {res.totalErrores === 0 ? "0 Errores" : `${res.totalErrores} Error(es)`}
                                  </span>
                                </div>
                                <div className="text-[11px] text-slate-400 space-y-1 mb-3">
                                  <div className="flex justify-between">
                                    <span>Tokens reconocidos:</span>
                                    <strong className="text-white font-mono">{res.totalTokens}</strong>
                                  </div>
                                  <div className="flex justify-between">
                                    <span>Tiempo de escaneo:</span>
                                    <strong className="text-purple-300 font-mono">{res.duracionMs} ms</strong>
                                  </div>
                                </div>
                              </div>
                              <button
                                onClick={() => handleCambioLenguaje(lang)}
                                className={`w-full py-1.5 rounded-lg text-xs font-semibold transition-all cursor-pointer ${
                                  lenguaje === lang
                                    ? "bg-brand-600 text-white font-bold shadow-md shadow-brand-600/30"
                                    : "bg-dark-800 text-slate-300 hover:text-white hover:bg-dark-750"
                                }`}
                              >
                                {lenguaje === lang ? "✓ Lenguaje Seleccionado" : `Cambiar a ${CONFIG_LENGUAJES[lang].nombre}`}
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}

                </div>
              </div>
            </>
          )}

          {/* VISTA 2: EJEMPLOS DE RÚBRICA */}
          {seccionActiva === "ejemplos" && (
            <div className="space-y-4 max-w-5xl mx-auto">
              <div className="flex items-center justify-between">
                <div>
                  <h2 className="text-lg font-bold text-white">Casos de Prueba de la Actividad</h2>
                  <p className="text-xs text-slate-400">Selecciona cualquiera de los casos obligatorios para cargarlo directamente en el editor.</p>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {PRESETS.map((p) => (
                  <div
                    key={p.id}
                    className="p-4 rounded-xl bg-dark-900 border border-dark-800 hover:border-brand-500 transition-all flex flex-col justify-between shadow-lg"
                  >
                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <span className="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-brand-600/20 text-brand-300 border border-brand-500/30">
                          {p.lenguaje.toUpperCase()}
                        </span>
                        <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-dark-800 text-slate-300">
                          {p.badge}
                        </span>
                      </div>
                      <h3 className="font-bold text-white text-sm">{p.titulo}</h3>
                      <p className="text-xs text-slate-400 mt-1 mb-3">{p.descripcion}</p>
                      <pre className="p-2.5 rounded bg-dark-950 font-mono text-[11px] text-cyan-300 overflow-x-auto border border-dark-800/80 max-h-28">
                        {p.codigo}
                      </pre>
                    </div>

                    <button
                      onClick={() => handleCargarPreset(p)}
                      className="mt-4 w-full py-2 rounded-lg bg-dark-800 hover:bg-brand-600 text-slate-200 hover:text-white font-semibold text-xs transition-colors flex items-center justify-center space-x-1.5"
                    >
                      <Icon name="play" className="w-3.5 h-3.5" />
                      <span>Cargar en el Editor</span>
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* VISTA 3: COMPARADOR 3 LENGUAJES */}
          {seccionActiva === "comparador" && (
            <div className="space-y-4 max-w-6xl mx-auto">
              <div className="flex items-center justify-between">
                <div>
                  <h2 className="text-lg font-bold text-white">Comparación Léxica Multi-Lenguaje</h2>
                  <p className="text-xs text-slate-400">
                    Evalúa el mismo código en Python, Java y JavaScript para inspeccionar divergencias en palabras reservadas y operadores.
                  </p>
                </div>
                <button
                  onClick={() => setSeccionActiva("editor")}
                  className="px-3 py-1.5 rounded-lg bg-dark-800 text-xs font-semibold text-slate-300 hover:text-white"
                >
                  Volver al Editor
                </button>
              </div>

              {/* 3 Paneles de Lenguajes */}
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                {["python", "java", "javascript"].map((lang) => {
                  const res = analizarLexico(codigo, lang);
                  return (
                    <div key={lang} className="bg-dark-900 rounded-xl border border-dark-800 p-4 flex flex-col justify-between shadow-xl">
                      <div>
                        <div className="flex items-center justify-between pb-3 border-b border-dark-800 mb-3">
                          <span className="font-bold text-sm text-white capitalize flex items-center space-x-1.5">
                            <span>{lang === "python" ? "🐍" : lang === "java" ? "☕" : "⚡"}</span>
                            <span>{CONFIG_LENGUAJES[lang].nombre}</span>
                          </span>
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                            res.totalErrores === 0 ? "bg-emerald-500/20 text-emerald-400" : "bg-rose-500/20 text-rose-400"
                          }`}>
                            {res.totalErrores === 0 ? "0 Errores" : `${res.totalErrores} Error(es)`}
                          </span>
                        </div>

                        <div className="space-y-2 mb-3">
                          <div className="flex justify-between text-xs text-slate-400">
                            <span>Tokens identificados:</span>
                            <span className="font-mono font-bold text-white">{res.totalTokens}</span>
                          </div>
                          <div className="flex justify-between text-xs text-slate-400">
                            <span>Tiempo de ejecución:</span>
                            <span className="font-mono text-purple-300">{res.duracionMs} ms</span>
                          </div>
                        </div>

                        <div className="max-h-48 overflow-y-auto font-mono text-[11px] p-2 bg-dark-950 rounded border border-dark-800">
                          {res.tokens.slice(0, 10).map(t => (
                            <div key={t.numero} className="flex justify-between py-0.5 text-slate-300">
                              <span className="text-cyan-300">{t.lexema}</span>
                              <span className="text-slate-500 text-[10px]">{t.categoria}</span>
                            </div>
                          ))}
                          {res.tokens.length > 10 && (
                            <div className="text-[10px] text-slate-500 text-center pt-1">+ {res.tokens.length - 10} tokens más...</div>
                          )}
                        </div>
                      </div>

                      <button
                        onClick={() => {
                          setLenguaje(lang);
                          setSeccionActiva("editor");
                        }}
                        className="mt-4 w-full py-1.5 rounded-lg bg-dark-800 hover:bg-brand-600 text-xs font-semibold text-slate-300 hover:text-white transition-colors"
                      >
                        Abrir en este lenguaje
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* VISTA 4: HISTORIAL DE ANÁLISIS */}
          {seccionActiva === "historial" && (
            <div className="space-y-4 max-w-5xl mx-auto">
              <div className="flex items-center justify-between">
                <div>
                  <h2 className="text-lg font-bold text-white">Historial de Análisis</h2>
                  <p className="text-xs text-slate-400">Consultas recientes persistidas localmente en este navegador.</p>
                </div>
                {historial.length > 0 && (
                  <button
                    onClick={() => {
                      localStorage.removeItem("jc_analyzer_history");
                      setHistorial([]);
                      mostrarToast("Historial eliminado", "info");
                    }}
                    className="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-dark-800 hover:bg-rose-950/40 text-slate-400 hover:text-rose-400 text-xs font-semibold border border-dark-700"
                  >
                    <Icon name="trash" className="w-3.5 h-3.5" />
                    <span>Borrar Historial</span>
                  </button>
                )}
              </div>

              {historial.length === 0 ? (
                <div className="py-16 text-center bg-dark-900 rounded-xl border border-dark-800">
                  <Icon name="history" className="w-10 h-10 text-slate-600 mx-auto mb-2" />
                  <p className="text-sm font-semibold text-slate-300">No hay análisis en el historial</p>
                  <p className="text-xs text-slate-500 mt-1">Los análisis ejecutados se guardarán automáticamente aquí.</p>
                </div>
              ) : (
                <div className="bg-dark-900 rounded-xl border border-dark-800 overflow-hidden shadow-xl">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-dark-850 text-slate-400 uppercase text-[10px] font-bold border-b border-dark-800">
                      <tr>
                        <th className="py-2.5 px-4">Hora</th>
                        <th className="py-2.5 px-4">Lenguaje</th>
                        <th className="py-2.5 px-4">Código Muestra</th>
                        <th className="py-2.5 px-3 text-center">Tokens</th>
                        <th className="py-2.5 px-3 text-center">Errores</th>
                        <th className="py-2.5 px-4 text-right">Acción</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-dark-800 font-mono">
                      {historial.map((item) => (
                        <tr key={item.id} className="hover:bg-dark-800/40">
                          <td className="py-2.5 px-4 text-slate-400">{item.fecha}</td>
                          <td className="py-2.5 px-4 font-sans font-bold capitalize text-slate-200">
                            {item.lenguaje}
                          </td>
                          <td className="py-2.5 px-4 text-slate-300 truncate max-w-xs">{item.codigoSnippet}</td>
                          <td className="py-2.5 px-3 text-center font-bold text-blue-400">{item.totalTokens}</td>
                          <td className="py-2.5 px-3 text-center font-bold">
                            <span className={item.totalErrores > 0 ? "text-rose-400" : "text-emerald-400"}>
                              {item.totalErrores}
                            </span>
                          </td>
                          <td className="py-2.5 px-4 text-right">
                            <button
                              onClick={() => {
                                setCodigo(item.codigoCompleto);
                                setLenguaje(item.lenguaje);
                                setSeccionActiva("editor");
                                ejecutarAnalisis(item.codigoCompleto, item.lenguaje);
                              }}
                              className="px-2.5 py-1 rounded bg-brand-600 hover:bg-brand-500 text-white font-sans font-bold text-xs"
                            >
                              Restaurar
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {/* VISTA 5: DOCUMENTACIÓN & TEORÍA AUTÓMATAS I */}
          {seccionActiva === "documentacion" && (
            <div className="space-y-6 max-w-4xl mx-auto text-slate-300 leading-relaxed text-xs">
              <div>
                <h2 className="text-xl font-bold text-white">Manual Teórico: Análisis Léxico en Compiladores</h2>
                <p className="text-xs text-slate-400 mt-1">Autómatas I – Fundamentos y Diferenciación de Errores</p>
              </div>

              {/* Tarjeta 1: ¿Qué es el Análisis Léxico? */}
              <div className="p-5 rounded-xl bg-dark-900 border border-dark-800 space-y-2">
                <h3 className="text-sm font-bold text-cyan-400 uppercase tracking-wider">1. La Primera Fase del Compilador (Scanner)</h3>
                <p>
                  El <strong>Analizador Léxico (Escáner)</strong> lee el código fuente carácter por carácter de izquierda a derecha. Su función es agrupar la secuencia de caracteres en unidades mínimas con significado llamadas <strong>Lexemas</strong>, y asociarles un tipo formal llamado <strong>Token</strong>.
                </p>
              </div>

              {/* Tarjeta 2: Lexemas vs Tokens */}
              <div className="p-5 rounded-xl bg-dark-900 border border-dark-800 space-y-2">
                <h3 className="text-sm font-bold text-brand-400 uppercase tracking-wider">2. Lexema vs Token</h3>
                <ul className="list-disc pl-5 space-y-1">
                  <li><strong>Lexema:</strong> Es la cadena concreta de caracteres en el código fuente (ejemplo: <code className="text-cyan-300 font-mono">edad</code>, <code className="text-cyan-300 font-mono">15.50</code>, <code className="text-cyan-300 font-mono">while</code>).</li>
                  <li><strong>Token:</strong> Es el símbolo terminal abstracto que representa esa categoría (ejemplo: <code className="text-purple-300 font-mono">IDENTIFICADOR</code>, <code className="text-purple-300 font-mono">NUMERO_DECIMAL</code>, <code className="text-purple-300 font-mono">PALABRA_RESERVADA</code>).</li>
                </ul>
              </div>

              {/* Tarjeta 3: Error Léxico vs Error Sintáctico (CRUCIAL RÚBRICA) */}
              <div className="p-5 rounded-xl bg-dark-900 border border-amber-800/60 bg-amber-950/10 space-y-3">
                <h3 className="text-sm font-bold text-amber-400 uppercase tracking-wider">3. Error Léxico vs Error Sintáctico (Caso Obligatorio '20 + * 5;')</h3>
                <p>
                  Uno de los errores conceptuales más frecuentes en la teoría de compiladores es confundir un error sintáctico con un error léxico:
                </p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-2">
                  <div className="p-3 bg-dark-950 rounded border border-dark-800">
                    <span className="font-bold text-rose-400 block mb-1">Error Léxico (Scanner)</span>
                    <p className="text-[11px] text-slate-400">
                      Ocurre cuando aparece un carácter o símbolo que <strong>no pertenece al alfabeto del lenguaje</strong> (ejemplo: <code className="text-rose-300 font-mono">@</code> en <code className="text-rose-300 font-mono">10 @ 5</code>) o cuando una cadena de texto no se cierra.
                    </p>
                  </div>
                  <div className="p-3 bg-dark-950 rounded border border-dark-800">
                    <span className="font-bold text-amber-400 block mb-1">Error Sintáctico (Parser)</span>
                    <p className="text-[11px] text-slate-400">
                      Ocurre cuando todos los tokens son válidos, pero <strong>su ordenamiento viola la gramática</strong>. En <code className="text-amber-300 font-mono">20 + * 5;</code>, los cinco tokens son 100% válidos individualmente, pero violan la estructura de operadores binarios.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* VISTA 6: CONFIGURACIÓN */}
          {seccionActiva === "configuracion" && (
            <div className="space-y-6 max-w-3xl mx-auto text-xs">
              <div>
                <h2 className="text-xl font-bold text-white">Configuración del Entorno</h2>
                <p className="text-xs text-slate-400 mt-1">Parámetros de escaneo y preferencias visuales del analizador léxico.</p>
              </div>

              <div className="p-5 rounded-xl bg-dark-900 border border-dark-800 space-y-4">
                <h3 className="text-sm font-bold text-white">Opciones del Motor Léxico</h3>
                
                <div className="flex items-center justify-between py-2 border-b border-dark-800">
                  <div>
                    <span className="font-bold text-slate-200 block">Análisis en tiempo real</span>
                    <span className="text-slate-400 text-[11px]">Ejecuta el escáner automáticamente mientras se escribe en el editor.</span>
                  </div>
                  <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                    Habilitado
                  </span>
                </div>

                <div className="flex items-center justify-between py-2 border-b border-dark-800">
                  <div>
                    <span className="font-bold text-slate-200 block">Modo estricto de Autómatas</span>
                    <span className="text-slate-400 text-[11px]">Prioridad de operadores multicarácter y detección preventiva de errores.</span>
                  </div>
                  <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-brand-500/20 text-brand-400 border border-brand-500/30">
                    Activo (12 Reglas)
                  </span>
                </div>

                <div className="flex items-center justify-between py-2">
                  <div>
                    <span className="font-bold text-slate-200 block">Medición de Rendimiento</span>
                    <span className="text-slate-400 text-[11px]">Cálculo en microsegundos de la función de transición con performance.now().</span>
                  </div>
                  <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-purple-500/20 text-purple-400 border border-purple-500/30">
                    Precisión Alta
                  </span>
                </div>
              </div>

              <div className="p-5 rounded-xl bg-dark-900 border border-dark-800 space-y-2">
                <h3 className="text-sm font-bold text-white">Acerca de la Aplicación</h3>
                <p className="text-slate-400">
                  <strong>JC ANALYZER – LEXICAL ERROR DETECTOR</strong> v2.0 PRO<br />
                  Materia: <strong>Autómatas I</strong> (Actividad 3)<br />
                  Arquitectura: Component-based SPA en React + Tailwind CSS + Motor Léxico puro en JavaScript.
                </p>
              </div>
            </div>
          )}

        </main>
      </div>

      {/* NOTIFICACIÓN TOAST FLOTANTE */}
      {toast && (
        <div className={`fixed bottom-5 right-5 z-50 px-4 py-2.5 rounded-xl shadow-2xl border text-xs font-bold flex items-center space-x-2 transition-all animate-bounce ${
          toast.tipo === "success"
            ? "bg-emerald-950 text-emerald-200 border-emerald-600"
            : toast.tipo === "error"
            ? "bg-rose-950 text-rose-200 border-rose-600"
            : "bg-dark-800 text-slate-100 border-dark-700"
        }`}>
          <Icon name={toast.tipo === "success" ? "checkCircle" : toast.tipo === "error" ? "alertCircle" : "info"} className="w-4 h-4" />
          <span>{toast.mensaje}</span>
        </div>
      )}

    </div>
  );
}

// Montar la aplicación React en el DOM
const contenedor = document.getElementById("root");
if (ReactDOM.createRoot) {
  const root = ReactDOM.createRoot(contenedor);
  root.render(<App />);
} else {
  ReactDOM.render(<App />, contenedor);
}

  </script>
